name: Check Melbourne weather

on:
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the weather helper
        run: python -m pip install requests

      - name: Show today's Melbourne weather
        run: python weather.py
