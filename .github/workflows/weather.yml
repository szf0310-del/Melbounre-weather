name: Check Melbourne weather

on:
  workflow_dispatch:
  schedule:
    # 9:00 AM Melbourne is 22:00 UTC during daylight-saving time
    # and 23:00 UTC during standard time. weather.py prevents duplicates.
    - cron: "0 22,23 * * *"

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the weather helper
        run: python -m pip install requests

      - name: Send today's Melbourne weather to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python weather.py
